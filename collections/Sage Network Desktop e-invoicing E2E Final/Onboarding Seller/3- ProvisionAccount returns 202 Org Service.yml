runtime:
  scripts:
  - type: before-request
    code: "// Generate random UUID for header X-Idempotency-Key\nvar uuid = require('uuid'); var randomUUID = uuid.v4();\nbru.setEnvVar(\"provisionAccountIdempotency\", randomUUID);\n \n// Generate random UUID for body BackOfficeId\nvar uuid = require('uuid'); var randomUUID = uuid.v4()\nbru.setEnvVar(\"provisionAccountBackOfficeId\", randomUUID);\n \n// Generate random UUID for body ExternalId\nvar uuid = require('uuid'); var randomUUID = uuid.v4();\nbru.setEnvVar(\"provisionAccountExternalId\", randomUUID);\n \n// account name\nbru.setEnvVar(\"provisionAccountName\", bru.interpolate('{{$randomCompanyName}}'));\n \n// create ManagingAccountId without Lodash\nfunction randomString(minValue, maxValue, dataSet = 'abcdefghijklmnopqrstuvwxyz0123456789') {\n  // if no minValue passed, default both to 50\n  if (typeof minValue !== 'number') {\n    minValue = 50;\n    maxValue = 50;\n  }\n  // if only minValue is a number, make maxValue = minValue\n  else if (typeof maxValue !== 'number') {\n    maxValue = minValue;\n  }\n \n  // pick a random integer between minValue and maxValue (inclusive)\n  const length = Math.floor(Math.random() * (maxValue - minValue + 1)) + minValue;\n \n  // build the random string\n  let result = '';\n  for (let i = 0; i < length; i++) {\n    result += dataSet.charAt(Math.floor(Math.random() * dataSet.length));\n  }\n  return result;\n}\n \n// set it in Bruno’s environment so you can use {{provisionAccountManagingAccountId}}\nbru.setEnvVar(\n  'provisionAccountManagingAccountId',\n  randomString()  // defaults to 50 chars if you don’t pass args\n);\n \n// create SubscriptionId without Lodash\nfunction randomString(minValue, maxValue, dataSet = 'abcdefghijklmnopqrstuvwxyz0123456789') {\n  // default to length 50 if nothing passed\n  if (typeof minValue !== 'number') {\n    minValue = 50;\n    maxValue = 50;\n  }\n  // if only min passed, make max = min\n  else if (typeof maxValue !== 'number') {\n    maxValue = minValue;\n  }\n \n  // pick a random integer between minValue and maxValue (inclusive)\n  const length = Math.floor(Math.random() * (maxValue - minValue + 1)) + minValue;\n \n  // build the string\n  let result = '';\n  for (let i = 0; i < length; i++) {\n    result += dataSet.charAt(Math.floor(Math.random() * dataSet.length));\n  }\n  return result;\n}\n \n// set it into Bruno’s environment\nbru.setEnvVar(\n  'provisionAccountSubscriptionId',\n  randomString()  // will default to 50 chars if you don’t pass args\n);\n// Prefer Node crypto if available\ntry {\n  const { randomUUID } = require(\"crypto\");\n  bru.setVar(\"idempotencyKey\", randomUUID());\n} catch {\n  // Fallback manual UUID-like generator\n  function s4() {\n    return Math.floor((1 + Math.random()) * 0x10000).toString(16).substring(1);\n  }\n  const uuid = `${s4()}${s4()}-${s4()}-${s4()}-${s4()}-${s4()}${s4()}${s4()}`;\n  bru.setVar(\"idempotencyKey\", uuid);\n}"
  - type: after-response
    code: |-
      test("OK", function () {
          expect(res.getStatus()).to.equal(202);
      });
