uid: 2bfe63ba-c238-463c-9bba-cc638d3062b2
info:
  name: 4. Poll Provision Account
  type: http
  seq: 3
http:
  method: POST
  url: '{{connectedBridgeURL}}/provision/account'
  headers:
  - name: Content-Type
    value: application/json
  - name: X-Idempotency-Key
    value: '{{provisionAccountIdempotency}}'
  body:
    type: json
    data: "{\n    \"User\": {\n        \"Email\": \"{{provisionAccountEmailBuyer}}\", \n        \"FirstName\": \"{{$randomFirstName}}\",\n        \"LastName\": \"{{$randomLastName}}\",\n        \"Locale\": \"fr-FR\"\n    },\n    \"Account\": {},\n    \"ProductSubscription\": {\n        \"ManagingAccountId\": \"{{provisionAccountManagingAccountId}}\",\n        \"SubscriptionId\": \"{{provisionAccountSubscriptionId}}\",\n        \"Origin\": \"{{origin}}\",\n        \"BackOfficeId\": \"{{provisionAccountBackOfficeId}}\", \n        \"BackOfficeSource\": \"{{STSProvider}}\"\n    },\n\"ProductLicences\": [{\n    \"Product\": \"{{productCode}}\",\n    \"ProductLicenseType\": \"{{productLicenseType}}\",\n    \"Expires\": \"2025-03-12 10:38:14Z\"\n    },\n {\"Product\": \"network\",\n            \"ProductLicenseType\": \"network-standard\",\n            \"Expires\": \"2030-01-01T00:00:00+00:00\"\n    }],\n    \"Licence\": {\n            \"Application\": \"{{STSApplication}}\",\n            \"Version\": \"{{STSVersion}}\",\n            \"Provider\": \"{{STSProvider}}\",\n            \"LicenceData\": \"{{STSLicenseData}}\"\n    },\n    \"Business\": {\n        \"Name\": \"{{provisionAccountName}}\",\n        \"ExternalId\": \"{{provisionAccountExternalId}}\",\n        \"ExternalSource\": \"Sage Desktop\",\n        \"RegisteredLocation\": \"FR\",\n        \"RegisteredCountry\": \"FR\",\n        \"BusinessAddress\": {\n            \"Type\": \"main\",\n            \"Line1\": \"Sage\",\n            \"Country\": \"FR\"\n        },\n        \"ProductInstance\": {\n            \"Name\": \"{{productCode}}\",\n            \"ProductCode\": \"{{productCode}}\"\n        }\n   }  \n}"
runtime:
  scripts:
  - type: after-response
    code: "if (res.getStatus() === 202) {\n  console.log(\"Still provisioning… will retry automatically\");\n}\nelse if (res.getStatus() === 201) {\n  const data = res.getBody();\n  bru.setEnvVar(\"provisionAccountResponseAccountIdBuyer\", data.AccountId);\n  bru.setEnvVar(\"provisionAccountResponseUserIdBuyer\",    data.UserId);\n  bru.setEnvVar(\"provisionAccountResponseBusinessIdBuyer\",data.BusinessId);\n\n  const net = data.ProductInstances.find(p => p.ProductCode === 'network');\n  const tenantId = net ? net.TenantId : (() => { throw new Error(\"No network product!\") })();\n\n  bru.setEnvVar(\"networkProductInstancesIdBuyer\",        net.Id);\n  bru.setEnvVar(\"networkProductInstancesTenantIdBuyer\",  tenantId);\n  bru.setEnvVar(\"networkProductInstancesProductCodeBuyer\", net.ProductCode);\n\n  // now build your encoded context\n  const email = bru.getVar(\"provisionAccountEmailBuyer\");\n  console.log (\"email\", email);\n  \n  const hint  = JSON.stringify({\n    TenantId: tenantId,\n    RoleIds:  [\"erp\"],\n    OwnerEmailHint: email\n  });\n  \n  console.log (\"hint\", hint)\n  bru.setEnvVar(\"contextHintEncodedBuyer\", stringToBase32(hint));\n  bru.setVar(\"contextHintEncodedBuyer\", stringToBase32(hint));\n}\n\n  console.log (\"contextHintEncodedBuyer\", bru.getVar(\"contextHintEncodedBuyer\"));\n\nfunction stringToBase32(str) {\n    var base32chars = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ234567\";\n    var binString = '';\n    var pad = 0;\n    for (var i = 0; i < str.length; i++) {\n        var charCode = str.charCodeAt(i);\n        var bits = charCode.toString(2);\n        binString += leftpad(bits, 8, '0');\n    }\n    var base32String = '';\n    for (var j = 0; j < binString.length; j += 5) {\n        var chunk = binString.substr(j, 5);\n        if (chunk.length < 5) {\n            pad = 5 - chunk.length;\n            chunk += '0'.repeat(pad);\n        }\n        var index = parseInt(chunk, 2);\n        base32String += base32chars[index];\n    }\n    // Add padding if necessary\n    if (pad > 0) {\n        base32String += '='.repeat(pad);\n    }\n    return base32String;\n}\nfunction leftpad(str, len, pad) {\n    return len + 1 >= str.length && (str = new Array(len + 1 - str.length).join(pad) + str), str;\n}"
