info:
  name: 7- Poll Provision Product Instance Org Service
  type: http
  seq: 7
http:
  method: POST
  url: '{{OrgServiceURL}}/v3/provision/account?PendingProductInstances=false'
  headers:
  - name: Content-Type
    value: application/json
  - name: X-Idempotency-Key
    value: '{{provisionAccountIdempotency3}}'
  - name: Authorization
    value: Bearer {{jwtCloudId}}
  body:
    type: json
    data: "{\n    \"Account\": {\n        \"Id\": \"{{accountId}}\"\n    },\n    \"Business\": {\n        \"Name\": \"{{CompanyName}}\",\n        \"CountryCode\": \"FR\",\n        \"ExternalId\": \"{{provisionAccountExternalId}}\",\n        \"ExternalSource\": \"Sage Desktop\",\n        \"RegisteredLocation\": \"FR\",\n        \"RegisteredCountry\": \"FR\",\n        \"BusinessAddress\": {\n        \"Type\": \"main\",\n        \"Line1\": \"Sage\",\n        \"Country\": \"FR\"\n          }\n      },\n      \"Licence\": {\n          \"Application\": \"sage.integrate.myproduct\",\n          \"Version\": \"0\",\n          \"Provider\": \"integrate.my.provider\",\n          \"LicenceData\": \"{\\\"serial\\\":\\\"ACTIVE\\\"}\"\n         },\n    \"ProductSubscription\": {\n        \"SubscriptionId\": \"{{ProductSubscriptionId}}\",\n        \"Origin\": \"product\",\n        \"BackOfficeId\": \"13922345\",\n        \"BackOfficeSource\": \"InTouch\",\n       \n        \"ProductLicenses\": \n            [ {\n                \"Product\": \"sage100FR\",\n                \"ProductCode\": \"sage100FR\",\n                \"ProductLicenseType\": \"sage100FR_premium\",\n                \"Expires\": \"2030-03-12 10:38:14Z\"\n              },\n              { \"Product\": \"network\",\n                 \"ProductCode\": \"network\",\n                \"ProductLicenseType\": \"network-standard\",\n                \"Expires\": \"2030-01-01T00:00:00+00:00\"\n              } ]\n          }\n}"
runtime:
  scripts:
  - type: after-response
    code: "const status = res.getStatus();\nconst data = res.getBody();\n\nif (status === 202) {\n  console.log(\"Still provisioning… will retry automatically\");\n}\n\nelse if (status === 201) {\n  // Save basic IDs\n  bru.setVar(\"provisionAccountResponseAccountId\", data.AccountId);\n  bru.setVar(\"provisionAccountResponseUserId\",    data.UserId);\n  bru.setVar(\"provisionAccountResponseBusinessId\",data.BusinessId);\n  \n\n  // Look for productCode = 'network'\n  const net = (data.ProductInstances || []).find(p => p.ProductCode === 'network');\n  if (!net) {\n    throw new Error(\"No network product!\");\n  }\n\n  const tenantId = net.TenantId;\n\n  bru.setVar(\"networkProductInstancesId\",         net.Id);\n  bru.setVar(\"networkProductInstancesTenantId\",   tenantId);\n  bru.setVar(\"networkProductInstancesProductCode\",net.ProductCode);\n  bru.setVar(\"TenantId\", tenantId);\n\n  // Also save first ProductInstance if exists\n  if (data.ProductInstances && data.ProductInstances.length > 0) {\n    bru.setVar(\"ProductInstanceId\", data.ProductInstances[0].Id);\n    bru.setVar(\"TenantId\",          data.ProductInstances[0].TenantId);\n    bru.setVar(\"DatasetId\",         data.ProductInstances[0].TenantId);\n    bru.setVar(\"networkProductInstancesTenantId\",         data.ProductInstances[0].TenantId);\n  }\n\n  // Build context hint\n  const email = bru.getVar(\"provisionAccountEmail\");\n  console.log(\"email\", email);\n\n  const hint = JSON.stringify({\n    TenantId: tenantId,\n    RoleIds: [\"erp\"],\n    OwnerEmailHint: email\n  });\n\n  console.log(\"hint\", hint);\n\n  const encodedHint = stringToBase32(hint);\n  bru.setVar(\"contextHintEncoded\", encodedHint);\n\n  console.log(\"contextHintEncoded\", encodedHint);\n}\n\n// If BusinessId exists at root level, store it\nif (!data.errors && data.BusinessId) {\n  bru.setVar(\"BusinessId\", data.BusinessId);\n}\n\n// ===== Helpers =====\nfunction stringToBase32(str) {\n  const base32chars = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ234567\";\n  let binString = \"\";\n  let pad = 0;\n\n  for (let i = 0; i < str.length; i++) {\n    const bits = str.charCodeAt(i).toString(2);\n    binString += leftpad(bits, 8, \"0\");\n  }\n\n  let base32String = \"\";\n  for (let j = 0; j < binString.length; j += 5) {\n    let chunk = binString.substr(j, 5);\n    if (chunk.length < 5) {\n      pad = 5 - chunk.length;\n      chunk += \"0\".repeat(pad);\n    }\n    const index = parseInt(chunk, 2);\n    base32String += base32chars[index];\n  }\n\n  if (pad > 0) {\n    base32String += \"=\".repeat(pad);\n  }\n\n  return base32String;\n}\n\nfunction leftpad(str, len, pad) {\n  return str.length >= len\n    ? str\n    : new Array(len + 1 - str.length).join(pad) + str;\n}"
