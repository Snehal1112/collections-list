info:
  name: M2M Org Service
  type: http
  seq: 2
http:
  method: POST
  url: https://id-shadow.sage.com/oauth/token
  headers:
  - name: Content-Type
    value: application/x-www-form-urlencoded
  body:
    type: form-urlencoded
    data: []
runtime:
  scripts:
  - type: after-response
    code: "// Grab parsed JSON response\nconst body = res.getBody();\n\n// Save the access token for follow-up requests\nif (body && body.access_token) {\n  bru.setVar(\"jwtCloudId\", body.access_token);\n  \n}\n\n// Compute and save absolute expiry time (ISO string)\nif (body && body.expires_in) {\n  const expiresAt = new Date(Date.now() + body.expires_in * 1000).toISOString();\n  bru.setVar(\"jwtCloudIdExpires\", expiresAt);\n  \n}\n\n// (optional) sanity check\ntest(\"Token response looks OK\", function () {\n  expect(res.getStatus()).to.be.oneOf([200, 201]);\n});"
