    code: "// --- helper ---\nfunction makeUUID() {\n  try {\n    const { randomUUID } = require(\"crypto\");\n    return randomUUID();\n  } catch {\n    function s4() {\n      return Math.floor((1 + Math.random()) * 0x10000).toString(16).substring(1);\n    }\n    return `${s4()}${s4()}-${s4()}-${s4()}-${s4()}-${s4()}${s4()}${s4()}`;\n  }\n}\n\n// --- previous value (raw) ---\nconst prev = bru.getVar(\"SubscriptionIdBuyer\");\n\n// --- new value ---\nconst next = makeUUID();\n\n// Set new values (runtime + env)\nbru.setVar(\"SubscriptionIdBuyer\", next);\nbru.setEnvVar(\"SubscriptionIdBuyer\", next);\n\n// --- Use bru.interpolate for logging or composing strings ---\nconst logLine = bru.interpolate(\n  \"[SubscriptionIdBuyer] prev={{SubscriptionIdBuyer}} -> next={{SubscriptionIdBuyer}}\"\n);\n// At this moment both prev/next equal (we just set it). If you want the *real* previous, use `prev` directly:\nconsole.log(`[SubscriptionIdBuyer] prev=${prev || \"<none>\"} -> next=${next}`);\n\n\n\nbru.setVar(\"provisionAccountIdempotency5\", makeUUID()); // \nbru.setEnvVar(\"provisionAccountIdempotency5\", bru.getVar(\"idempotencyKey\"));"
