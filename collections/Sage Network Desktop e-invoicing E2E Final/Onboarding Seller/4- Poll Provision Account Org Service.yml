uid: 7e834da7-bbe9-4cb1-a780-a87fc1746287
info:
  name: 4- Poll Provision Account Org Service
  type: http
  seq: 4
http:
  method: POST
  url: '{{OrgServiceURL}}/v3/provision/account?PendingProductInstances=false'
  headers:
  - name: X-Idempotency-Key
    value: '{{provisionAccountIdempotency}}'
  - name: Authorization
    value: Bearer {{jwtCloudId}}
  body:
    type: json
    data: |-
      {
          "User": {
              "Email": "{{provisionAccountEmail}}",
              "Locale": "fr-FR",
              "UserAuths": [{
                  "PrincipalId":"{{LoggedInUserAuth0PrincipalId}}",
                  "ProviderId":"{{LoggedInUserAuth0PrincipalId}}",
                  "ProviderType":"CloudID"
              }]
          },
          "Account": {
              "ExternalId": "{{provisionAccountExternalId}}",
              "ExternalSource": "Postman Provisioner"
          }
      }
runtime:
  scripts:
  - type: after-response
    code: |-
      const jsonData = res.getBody();

      if (!jsonData.errors) {
        // Save variables to use later in this collection run
        bru.setVar("accountId", jsonData.AccountId);
        bru.setVar("UserId", jsonData.UserId);
      }
